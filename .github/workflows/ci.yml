name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Python einrichten
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Testabhängigkeiten installieren
        run: python -m pip install --requirement requirements-dev.txt
      - name: Sprachverständnis-Sicherheitsgate
        run: python -m pytest -q tests/test_language_eval_corpus.py
      - name: Tests mit Coverage ausführen
        if: matrix.python-version == '3.12'
        run: >-
          python -m pytest -q
          --cov=custom_components/ha_nlu
          --cov-report=term-missing:skip-covered
          --cov-report=xml
      - name: Tests ausführen
        if: matrix.python-version != '3.12'
        run: python -m pytest -q
      - name: Coverage-Bericht speichern
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
      - name: Pyright-Typprüfung sichtbar machen
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: python -m pyright
      - name: Pyright-Strict-Scope absichern
        if: matrix.python-version == '3.12'
        run: >-
          python -m pyright
          custom_components/ha_nlu/entity_scope.py
          custom_components/ha_nlu/risk.py
          custom_components/ha_nlu/automation_history.py
          custom_components/ha_nlu/query_target.py
          custom_components/ha_nlu/capability_audit.py
          custom_components/ha_nlu/household_query.py
          custom_components/ha_nlu/automation_simulation.py
          custom_components/ha_nlu/nlu/automation_operations.py
          custom_components/ha_nlu/alias_learning.py
          custom_components/ha_nlu/nlu/composition.py
          custom_components/ha_nlu/nlu/entity_resolution.py
          custom_components/ha_nlu/nlu/grounded_answer.py
          custom_components/ha_nlu/nlu/meaning.py
          custom_components/ha_nlu/nlu/verb_state_query.py
      - name: Statische Importprüfung
        run: python -m pyflakes custom_components tests scripts

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Home-Assistant-Integration validieren
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  home-assistant-smoke:
    name: Home Assistant Stable Smoke-Test
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Integration und erzeugte Automation mit echtem Home Assistant prüfen
        run: >-
          docker run --rm
          --entrypoint python3
          --volume "${GITHUB_WORKSPACE}:/workspace:ro"
          --env PYTHONPATH=/workspace/custom_components
          ghcr.io/home-assistant/home-assistant:stable
          /workspace/scripts/validate_generated_automation_schema.py

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: HACS-Repository validieren
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: "false"
