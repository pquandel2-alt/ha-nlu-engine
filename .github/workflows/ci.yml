name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Python einrichten
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Testabhängigkeiten installieren
        run: python -m pip install --requirement requirements-dev.txt
      - name: Sprachverständnis-Sicherheitsgate
        run: bash scripts/run_language_eval.sh
      - name: V8-Shadow-Baseline prüfen
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/v7_shadow_report.py
          --check docs/perf/v7-shadow-baseline-6.1.0.json
          --quiet
      - name: V9-Latenzbudget bei großer Registry prüfen
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/benchmark_v6_baseline.py
          --pipeline understand
          --scales 5000
          --iterations 20
          --warmup 3
          --max-p95-ms 100
      - name: V10 Goal-/Planungsbudgets prüfen
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/benchmark_v10.py
          --registry-size 5000
          --iterations 30
          --max-p95-ms 100
      - name: V11 Lern-/Vorhersagebudgets prüfen
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/benchmark_v11.py
          --iterations 1000
          --max-p95-ms 100
      - name: V12 Kontext-/Proaktivbudgets prüfen
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/benchmark_v12.py
          --registry-size 5000
          --iterations 300
      - name: V11-Wirkungsevidenz und V12-Sicherheits-/OOD-Gate
        run: >-
          python -m pytest -q
          tests/test_v11_action_evidence_semantics.py
          tests/test_conversation_action_evidence.py
          tests/test_v12_garage_e2e.py
          tests/test_v12_behavior.py
          tests/test_v12_conversation.py
          tests/test_v12_ood_corpus.py
          tests/test_v12_persistence_restart.py
          tests/test_v12_policies.py
          tests/test_v12_room_attention_routing.py
          tests/test_v12_runtime.py
          tests/test_v12_units.py
          tests/test_v12_decision_matrix.py
      - name: Tests mit Coverage ausführen
        if: matrix.python-version == '3.12'
        run: >-
          python -m pytest -q
          --cov=custom_components/homeintent
          --cov-report=term-missing:skip-covered
          --cov-report=xml
      - name: Tests ausführen
        if: matrix.python-version != '3.12'
        run: python -m pytest -q
      - name: Coverage-Bericht speichern
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
      - name: Vollständige Pyright-Typprüfung
        if: matrix.python-version == '3.12'
        run: python -m pyright
      - name: Pyright-Strict-Scope absichern
        if: matrix.python-version == '3.12'
        run: >-
          python -m pyright
          custom_components/homeintent/agent_action_policy.py
          custom_components/homeintent/agent_delivery.py
          custom_components/homeintent/native_timer.py
          custom_components/homeintent/agent_event.py
          custom_components/homeintent/agent_event_store.py
          custom_components/homeintent/agent_runtime.py
          custom_components/homeintent/execution_policy.py
          custom_components/homeintent/service_executor.py
          custom_components/homeintent/entity_scope.py
          custom_components/homeintent/risk.py
          custom_components/homeintent/automation_history.py
          custom_components/homeintent/query_target.py
          custom_components/homeintent/capability_audit.py
          custom_components/homeintent/household_query.py
          custom_components/homeintent/appliance_lifecycle.py
          custom_components/homeintent/automation_simulation.py
          custom_components/homeintent/nlu/automation_operations.py
          custom_components/homeintent/alias_learning.py
          custom_components/homeintent/nlu/composition.py
          custom_components/homeintent/nlu/entity_resolution.py
          custom_components/homeintent/nlu/grounded_answer.py
          custom_components/homeintent/nlu/german_morphology.py
          custom_components/homeintent/nlu/meaning.py
          custom_components/homeintent/nlu/evidence.py
          custom_components/homeintent/nlu/verb_state_query.py
          custom_components/homeintent/nlu/understanding.py
          custom_components/homeintent/nlu/language_frontend.py
          custom_components/homeintent/nlu/german_structure.py
          custom_components/homeintent/nlu/semantic_graph.py
          custom_components/homeintent/nlu/semantic_projection.py
          custom_components/homeintent/nlu/semantic_snapshot.py
          custom_components/homeintent/nlu/discourse.py
          custom_components/homeintent/nlu/temporal_semantics.py
          custom_components/homeintent/nlu/repair_semantics.py
          custom_components/homeintent/nlu/semantic_aliases.py
          custom_components/homeintent/nlu/semantic_catalog.py
          custom_components/homeintent/nlu/semantic_compiler.py
          custom_components/homeintent/nlu/semantic_interpreter.py
          custom_components/homeintent/nlu/query_followup_compiler.py
          custom_components/homeintent/nlu/query_command.py
          custom_components/homeintent/nlu/query_executor.py
          custom_components/homeintent/name_similarity.py
          custom_components/homeintent/nlu/entity_clarification.py
          custom_components/homeintent/house_graph.py
          custom_components/homeintent/memory.py
          custom_components/homeintent/situation.py
          custom_components/homeintent/planner.py
          custom_components/homeintent/response_planner.py
          custom_components/homeintent/proactive_decision.py
          custom_components/homeintent/dialog_manager.py
          custom_components/homeintent/adapters.py
          custom_components/homeintent/memory_intent.py
          custom_components/homeintent/goal_intent.py
          custom_components/homeintent/document_intent.py
          custom_components/homeintent/comfort_intent.py
          custom_components/homeintent/automation_scenarios.py
          custom_components/homeintent/agent_config_validation.py
          custom_components/homeintent/routine_intent.py
          custom_components/homeintent/procedure_intent.py
          custom_components/homeintent/effect_monitor.py
          custom_components/homeintent/management_understanding.py
          custom_components/homeintent/goal_model.py
          custom_components/homeintent/goal_run.py
          custom_components/homeintent/user_context.py
          custom_components/homeintent/profiles.py
          custom_components/homeintent/monitor_goal.py
          custom_components/homeintent/plan_modification.py
          custom_components/homeintent/retry_policy.py
          custom_components/homeintent/execution_coordinator.py
          custom_components/homeintent/storage_migration.py
      - name: V11 Pyright-Strict-Scope absichern
        if: matrix.python-version == '3.12'
        run: python -m pyright --project pyrightconfig-v11-strict.json
      - name: V12 Pyright-Strict-Scope absichern
        if: matrix.python-version == '3.12'
        run: python -m pyright --project pyrightconfig-v12-strict.json
      - name: Statische Importprüfung
        run: python -m pyflakes custom_components tests scripts

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Home-Assistant-Integration validieren
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  home-assistant-smoke:
    name: Home Assistant Stable Smoke-Test
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Integration und erzeugte Automation mit echtem Home Assistant prüfen
        run: >-
          docker run --rm
          --entrypoint python3
          --volume "${GITHUB_WORKSPACE}:/workspace:ro"
          --env PYTHONPATH=/workspace/custom_components
          ghcr.io/home-assistant/home-assistant:stable
          /workspace/scripts/validate_generated_automation_schema.py

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: HACS-Repository validieren
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: "false"
