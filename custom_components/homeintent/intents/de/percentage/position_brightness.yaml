language: "de"
intents:
  # A single generic intent for both cover-position and light-brightness
  # percent targets. Which service call applies is decided in
  # engine.py::_match_percentage from the *resolved entity's domain*, not
  # from the verb used here - "stelle"/"setze" are generic German verbs
  # that speakers use for both covers and lights, so splitting this into
  # two verb-disambiguated intents either rejects valid phrasings or
  # (worse) silently mis-routes them to the wrong intent. See
  # PERCENT_INTENTS in service_call.py.
  HassSetPercentage:
    data:
      - sentences:
          # Multi-target percentage commands are resolved by domain and
          # room/floor, never by treating the complete phrase as one entity
          # name ("Fahre alle Rollläden im Erdgeschoss auf 90 Prozent").
          # Keep these specific forms before the open {name} wildcard.
          - "[kannst du|bitte] (fahre|mach|stelle|setze) [die] {quantifier} [die] {domain} (in der|in dem|im|am|beim) {area} auf {percent} [Prozent]"
          - "[kannst du|bitte] (fahre|mach|stelle|setze) (in der|in dem|im|am|beim) {area} [die] {quantifier} [die] {domain} auf {percent} [Prozent]"
          - "[kannst du|bitte] (fahre|mach|stelle|setze) [die] {domain} (in der|in dem|im|am|beim) {area} [die] {quantifier} auf {percent} [Prozent]"
          - "[kannst du|bitte] (fahre|mach|stelle|setze) die {domain} (in der|in dem|im|am|beim) {area} auf {percent} [Prozent]"
          - "[kannst du|bitte] (fahre|mach|stelle|setze) [die] {quantifier} [die] {domain} auf {percent} [Prozent]"
          - "[kannst du|bitte] (fahre|mach|stelle|setze) [die] {quantifier} [die] {domain} (in der|in dem|im|am|beim) {area} (halb runter|halb hoch|halb|zur hälfte|auf die hälfte)"
          - "[kannst du|bitte] (fahre|mach|stelle|setze) (in der|in dem|im|am|beim) {area} [die] {quantifier} [die] {domain} (halb runter|halb hoch|halb|zur hälfte|auf die hälfte)"
          - "[kannst du|bitte] (fahre|mach|stelle|setze) [die] {domain} (in der|in dem|im|am|beim) {area} [die] {quantifier} (halb runter|halb hoch|halb|zur hälfte|auf die hälfte)"
          - "[kannst du|bitte] (fahre|mach|stelle|setze) die {domain} (in der|in dem|im|am|beim) {area} (halb runter|halb hoch|halb|zur hälfte|auf die hälfte)"
          - "[kannst du|bitte] (fahre|mach|stelle|setze) [die] {quantifier} [die] {domain} (halb runter|halb hoch|halb|zur hälfte|auf die hälfte)"
          - "[kannst du|bitte] (fahre|mach|stelle|setze) [den|die|das] {name} (halb runter|halb hoch|halb|zur hälfte|auf die hälfte)"
          # "Prozent" is optional (HomeIntent plan V4.2, "Number
          # Normalization": "50" alone must normalize to the same value as
          # "50 Prozent") - safe to drop here without risking a guess: the
          # resolved entity's domain (cover/light) is the only thing that
          # decides the service call, and PERCENT_INTENTS below only knows
          # those two, so a bare number on any other domain (fan/climate,
          # which use their own "Stufe"/"Grad" grammars) still falls
          # through to no-match instead of being silently misinterpreted.
          # Verb before {name}: "stelle/fahre/mach/setze die Rolllade auf 30 [Prozent] [runter|hoch]"
          - "[kannst du|bitte] (fahre|mach|stelle|setze) [den|die|das] {name} auf {percent} [Prozent] [runter|hoch|Helligkeit]"
          # Verb after: "kannst du die Rolllade auf 30 [Prozent] fahren/dimmen/einstellen/stellen"
          - "[kannst du|bitte] [den|die|das] {name} auf {percent} [Prozent] (dimmen|einstellen|fahren|stellen)"
          # {comparator} (HomeIntent plan V4.6, "Comparisons", setpoint-
          # synonym half - user decision 2026-08-11): "auf mindestens 50
          # Prozent"/"auf nicht höher als 70 Prozent" still set the target to
          # exactly {percent} (PercentageParser.parse() records the
          # comparator, doesn't change the target) - separate sentences
          # rather than an optional "[{comparator}]" group, same
          # one-slot-combination-per-line style this project's YAML already
          # follows (see e.g. quantifiers/light_switch_all.yaml).
          - "[kannst du|bitte] (fahre|mach|stelle|setze) [den|die|das] {name} auf {comparator} {percent} [Prozent] [runter|hoch|Helligkeit]"
          - "[kannst du|bitte] [den|die|das] {name} auf {comparator} {percent} [Prozent] (dimmen|einstellen|fahren|stellen)"
