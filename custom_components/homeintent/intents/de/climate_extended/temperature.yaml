language: "de"
intents:
  # Absolute target temperature ("stelle ... auf 21 Grad"). {temperature}
  # is anchored by the literal "auf ... Grad" around it, never directly
  # adjacent to {name} - avoids the unanchored-WildcardSlotList-next-to-
  # RangeSlotList bug documented for light_extended/color_brightness.yaml
  # (v2 plan Phase 14). Empirically verified against hassil==3.11.0 before
  # writing this file (v2 plan Phase 17, "Climate-NLU").
  HassClimateSetTemperature:
    data:
      - sentences:
          - "stelle [den|die|dem|der|das] {name} auf {temperature} Grad"
          - "[kannst du] mach [den|die|dem|der|das] {name} auf {temperature} Grad"
          - "[kannst du|bitte] [den|die|dem|der|das] {name} auf {temperature} Grad stellen"
          # {comparator} (HomeIntent plan V4.6, "Comparisons", setpoint-
          # synonym half - user decision 2026-08-11): same "records how it
          # was phrased, doesn't change the target" behaviour as
          # percentage/position_brightness.yaml's own {comparator} sentences.
          - "stelle [den|die|dem|der|das] {name} auf {comparator} {temperature} Grad"
          - "[kannst du] mach [den|die|dem|der|das] {name} auf {comparator} {temperature} Grad"
          - "[kannst du|bitte] [den|die|dem|der|das] {name} auf {comparator} {temperature} Grad stellen"
  # "wärmer"/"kälter" and "erhöhe/senke die Temperatur" - no {amount} slot:
  # the plan's own example parameter ({"operation": "increase", "amount": 1})
  # only calls for a fixed default step, not a user-specified one (unlike
  # light brightness in Phase 14, where "20 Prozent heller" was an explicit
  # plan requirement) - so there is deliberately no explicit-amount sentence
  # variant here, keeping this grammar free of the Bug 2 (sentence-order)
  # class that variant would otherwise require guarding against.
  #
  # "[den|die|dem|der|das]" (all four German articles, not just the
  # nominative/accusative "den|die|das" used elsewhere in this project) is
  # needed here specifically because "erhöhe die Temperatur von der
  # Heizung"/"senke die Temperatur bei der Heizung" use the dative "der" -
  # without it in the optional group, {name} swallows "der" too
  # (name="der Heizung") since the group fails to match and the unanchored
  # wildcard absorbs it instead - verified empirically.
  HassClimateIncreaseTemperature:
    data:
      - sentences:
          - "[kannst du] mach [den|die|dem|der|das] {name} wärmer"
          - "[kannst du|bitte] [den|die|dem|der|das] {name} wärmer machen"
          - "erhöhe [die Temperatur von|die Temperatur bei|die Temperatur an] [den|die|dem|der|das] {name}"
  HassClimateDecreaseTemperature:
    data:
      - sentences:
          - "[kannst du] mach [den|die|dem|der|das] {name} kälter"
          - "[kannst du|bitte] [den|die|dem|der|das] {name} kälter machen"
          - "senke [die Temperatur von|die Temperatur bei|die Temperatur an] [den|die|dem|der|das] {name}"
