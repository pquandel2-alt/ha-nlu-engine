language: "de"
intents:
  HassTurnOn:
    data:
      - sentences:
          - "mach es an"
          - "schalte es an"
          - "schalte es ein"
          - "mach die auch an"
          - "schalte die auch an"
          - "dreh es an"
          - "lass es an"
          # "{domain} im selben Raum" (HomeIntent plan V4.4, "Relative
          # Locations" - "im selben Raum" is the same last-area-anchored
          # concept "dort" already covers, just different wording). Same
          # _resolve_area_anchored() resolution as HassOpenCover/
          # HassCloseCover's {domain} dort sentences below.
          - "mach [die|der|das] {domain} im selben Raum an"
          - "schalte [die|der|das] {domain} im selben Raum ein"
          # "hier" (V6 architecture plan, V6.13 "Relative Locations", Brain
          # node 2a0871f8-05a4-4e0d-8cb6-80a8ff939480 - plan's own example
          # "Mach hier das Licht aus." + Context current_area=Wohnzimmer ->
          # hier=Wohnzimmer). Resolved by the exact same
          # _resolve_area_anchored() function as "dort"/"im selben Raum"
          # above - "hier" and "dort" both mean "the area from context",
          # neither is spatially distinguished from the other by this
          # codebase (no adjacency model exists, see V6.13's own deferred
          # nebenan/drüben note in the Wave 4 results).
          - "mach [die|der|das] {domain} hier an"
          - "schalte [die|der|das] {domain} hier ein"
  HassTurnOff:
    data:
      - sentences:
          - "mach es aus"
          - "schalte es aus"
          - "mach die auch aus"
          - "schalte die auch aus"
          - "dreh es aus"
          - "lass es aus"
          - "mach [die|der|das] {domain} im selben Raum aus"
          - "schalte [die|der|das] {domain} im selben Raum aus"
          - "mach [die|der|das] {domain} hier aus"
          - "schalte [die|der|das] {domain} hier aus"
  HassLightBrighten:
    data:
      - sentences:
          - "mach es heller"
  HassLightDim:
    data:
      - sentences:
          - "mach es dunkler"
  HassOpenCover:
    data:
      - sentences:
          - "[die|der|das] {domain} dort hoch"
          - "fahr [die|der|das] {domain} dort hoch"
          - "fahre [die|der|das] {domain} dort hoch"
          # Verb-first word order with "dort" before the domain (HomeIntent
          # plan V4.3, "Implicit Targets" - plan's own example is "Mach dort
          # die Rollläden runter.", mirrored here for the open direction).
          # Same _resolve_area_anchored() resolution as the sentences above -
          # only the wording differs, not the resolution logic.
          - "mach dort [die|der|das] {domain} hoch"
          - "mach [die|der|das] {domain} dort hoch"
          - "[die|der|das] {domain} hier hoch"
          - "fahr [die|der|das] {domain} hier hoch"
          - "fahre [die|der|das] {domain} hier hoch"
          - "mach hier [die|der|das] {domain} hoch"
          - "mach [die|der|das] {domain} hier hoch"
  HassCloseCover:
    data:
      - sentences:
          - "[die|der|das] {domain} dort runter"
          - "fahr [die|der|das] {domain} dort runter"
          - "fahre [die|der|das] {domain} dort runter"
          - "mach dort [die|der|das] {domain} runter"
          - "mach [die|der|das] {domain} dort runter"
          - "[die|der|das] {domain} hier runter"
          - "fahr [die|der|das] {domain} hier runter"
          - "fahre [die|der|das] {domain} hier runter"
          - "mach hier [die|der|das] {domain} runter"
          - "mach [die|der|das] {domain} hier runter"
  HassReferenceOther:
    data:
      - sentences:
          - "die andere"
          - "der andere"
          - "das andere"
          - "die daneben"
          - "der daneben"
          - "das daneben"
  HassTurnOnOthers:
    data:
      - sentences:
          - "mach die anderen an"
          - "mach die anderen auch an"
          - "schalte die anderen an"
          - "schalte die anderen auch an"
  HassTurnOffOthers:
    data:
      - sentences:
          - "mach die anderen aus"
          - "mach die anderen auch aus"
          - "schalte die anderen aus"
          - "schalte die anderen auch aus"
