language: "de"
intents:
  # {level} is anchored by the literal "auf Stufe" before it, not directly
  # adjacent to {name} - avoids the unanchored-WildcardSlotList-next-to-
  # RangeSlotList bug documented for light_extended/color_brightness.yaml
  # (v2 plan Phase 14). Empirically verified against hassil==3.11.0 before
  # writing this file (v2 plan Phase 16, "Fan-NLU erweitern").
  HassFanSetSpeed:
    data:
      - sentences:
          - "stelle [den|die|das] {name} auf Stufe {level}"
          - "[kannst du] mach [den|die|das] {name} auf Stufe {level}"
          - "[kannst du|bitte] [den|die|das] {name} auf Stufe {level} stellen"
  # "schneller"/"langsamer" map directly to HA's native fan.increase_speed/
  # decrease_speed services - unlike light brightness (Phase 14), fan has no
  # invented step-size parameter to decide on; HA/the device own the step.
  HassFanIncreaseSpeed:
    data:
      - sentences:
          - "[kannst du] mach [den|die|das] {name} schneller"
          - "[kannst du|bitte] [den|die|das] {name} schneller machen"
  HassFanDecreaseSpeed:
    data:
      - sentences:
          - "[kannst du] mach [den|die|das] {name} langsamer"
          - "[kannst du|bitte] [den|die|das] {name} langsamer machen"
