language: "de"
intents:
  # V5 Wave 1 (V5.3) - the Sun Trigger. {sun_event} values match HA's own
  # `sun` trigger `event` parameter directly (lexicon.py). The offset
  # sentence's {offset_direction} ("vor"/"nach") maps onto a signed
  # offset_minutes in automation_trigger_parser.py (negative for "vor" -
  # HA's own `sun` trigger offset convention), not two separately-declared
  # intents.
  HassSunTrigger:
    data:
      - sentences:
          - "bei {sun_event}"
          - "[wenn|sobald|falls] es {sun_event} ist"
          - "[wenn|sobald|falls] {offset} Minuten {offset_direction} {sun_event}"
