language: "de"
intents:
  # V6.23 ("Natural Context" - cross-property follow-up, HomeIntent plan V6
  # Teil 5/7): bare "wärmer"/"kälter" with no {name}, same elliptical shape
  # as brightness.yaml's "heller"/"dunkler". Reuses climate_extended/
  # temperature.yaml's own already-established "wärmer"/"kälter" vocabulary
  # (HassClimateIncreaseTemperature/HassClimateDecreaseTemperature) rather
  # than inventing new words - "niemals raten". engine.py's
  # match_followup() picks the target domain (light vs climate) from which
  # spec dict the parsed intent name falls into, so no grammar-level
  # ambiguity between this file and brightness.yaml is possible: "heller"/
  # "dunkler"/"wärmer"/"kälter" are four disjoint literal sentences.
  HassClimateIncreaseTemperature:
    data:
      - sentences:
          - "wärmer"
  HassClimateDecreaseTemperature:
    data:
      - sentences:
          - "kälter"
