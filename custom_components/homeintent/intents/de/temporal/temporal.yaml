language: "de"
intents:
  # HomeIntent plan V4.7, "Temporal Expressions" - the 10th separately-
  # compiled hassil grammar. Reuses the core HassTurnOn/HassTurnOff intent
  # names (parsers.py's TemporalParser resolves {name} and builds the exact
  # same ServiceCallPlan the plain light_switch.yaml sentences would - only
  # the parsed TemporalExpression is additionally recorded in
  # frame.parameters["temporal"]).
  #
  # {temporal_kind} ("in"/"für") disambiguates delay from duration on the
  # otherwise-identical {amount}/{unit} shape - see parsers.py's
  # _TEMPORAL_KIND_SLOT_LIST docstring for why this is one merged sentence
  # rather than two near-duplicate ones.
  #
  # {name} is directly followed by {relative} with no literal word in
  # between - empirically verified against hassil==3.11.0 before writing
  # this file (same discipline as every other grammar here): unlike the
  # documented WildcardSlotList-next-to-RangeSlotList bug (light_extended/
  # color_brightness.yaml), a WildcardSlotList directly followed by a
  # TextSlotList's closed vocabulary parses correctly.
  HassTurnOn:
    data:
      - sentences:
          - "[schalte|mach] [den|die|das] {name} {temporal_kind} {amount} {unit} an"
          - "[schalte|mach] [den|die|das] {name} {relative} an"
          - "[schalte|mach] [den|die|das] {name} um {hour} Uhr an"
  HassTurnOff:
    data:
      - sentences:
          - "[schalte|mach] [den|die|das] {name} {temporal_kind} {amount} {unit} aus"
          - "[schalte|mach] [den|die|das] {name} {relative} aus"
          - "[schalte|mach] [den|die|das] {name} um {hour} Uhr aus"
