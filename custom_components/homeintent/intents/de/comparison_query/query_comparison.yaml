language: "de"
intents:
  # HomeIntent plan V4.6, "Comparisons", query-filter half (user decision
  # 2026-08-11: needed alongside the setpoint-synonym half - see
  # percentage/position_brightness.yaml and climate_extended/temperature.yaml
  # for that side). The 9th separately-compiled hassil grammar - {domain}
  # here uses its own dedicated slot list (parsers.py's
  # _COMPARISON_DOMAIN_SLOT_LIST), not the shared _DOMAIN_SLOT_LIST every
  # other grammar uses, since "Heizung"/"Raum" as climate-domain synonyms
  # only make sense in this comparison-query context.
  #
  # {percent} and {temperature} are two disjoint sentence shapes (a sentence
  # uses exactly one) - ComparisonQueryParser.parse() rejects any
  # domain/value-slot combination that isn't ("light"|"cover")+percent or
  # "climate"+temperature. Area is optional, expressed as separate
  # with-area/without-area sentence lines rather than a nested optional
  # group, same style precedent quantifiers/light_switch_all.yaml already
  # established.
  HassQueryComparison:
    data:
      - sentences:
          - "welche {domain} sind {comparator} {percent} Prozent"
          - "welche {domain} sind {comparator} {percent} Prozent [in der|in dem|im|am|beim] {area}"
          - "welche {domain} sind {comparator} {temperature} Grad"
          - "welche {domain} sind {comparator} {temperature} Grad [in der|in dem|im|am|beim] {area}"
