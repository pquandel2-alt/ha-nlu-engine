language: "de"
intents:
  # HomeIntent plan V4.9, "Cross-Sentence References" - first-turn half. The
  # 11th separately-compiled hassil grammar (see parsers.py's
  # AreaQueryParser docstring): a state query with no entity name at all,
  # only a room ("wie warm ist es im Wohnzimmer" - the plan's own example).
  # "[warm|kalt]" is decorative, not a captured slot - same precedent
  # query.yaml's own "[hoch|warm|kalt|hell]" already established.
  HassGetState:
    data:
      - sentences:
          - "wie [warm|kalt] ist es [in der|in dem|im|am|beim] {area}"
