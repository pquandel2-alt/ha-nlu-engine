language: "de"
intents:
  HassTurnOn:
    data:
      - sentences:
          - "mach [den|die|das] {name} an"
          - "schalte [den|die|das] {name} ein"
          - "[den|die|das] {name} einschalten"
          - "kannst du [den|die|das] {name} anmachen"
          - "bitte [den|die|das] {name} an"
          # "dreh"/"lass" (HomeIntent plan V4.1, "Advanced German Language"):
          # the two verbs from the plan's list that had zero coverage
          # anywhere - idiomatic for on/off ("Dreh das Licht an.", "Lass
          # das Licht an."), unlike "stell"/"setze" which already have
          # their own, more idiomatic home in percentage/temperature
          # grammar and would sound unnatural bolted onto plain on/off.
          - "dreh [den|die|das] {name} an"
          - "lass [den|die|das] {name} an"
  HassTurnOff:
    data:
      - sentences:
          - "mach [den|die|das] {name} aus"
          - "schalte [den|die|das] {name} aus"
          - "[den|die|das] {name} ausschalten"
          - "kannst du [den|die|das] {name} ausmachen"
          - "bitte [den|die|das] {name} aus"
          - "dreh [den|die|das] {name} aus"
          - "lass [den|die|das] {name} aus"
  HassToggle:
    data:
      - sentences:
          - "schalte [den|die|das] {name} um"
          - "[den|die|das] {name} umschalten"
          - "toggle [den|die|das] {name}"
