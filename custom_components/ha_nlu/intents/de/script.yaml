language: "de"
intents:
  # Skript-Aktivierung (2026-08-20): "[das]" only, no literal "Skript" noun
  # before {name} - same convention light_switch.yaml/cover.yaml already
  # use (article only, the entity's own friendly_name carries the rest), so
  # both "starte Gute Nacht" and "starte das Skript Gute Nacht" resolve the
  # same way once "Skript" happens to be part of the friendly_name itself.
  HassRunScript:
    data:
      - sentences:
          - "[kannst du] starte [das] {name}"
          - "[kannst du] aktiviere [das] {name}"
          - "[kannst du] führe [das] {name} aus"
          - "[bitte] [das] {name} starten"
          - "[bitte] [das] {name} ausführen"
