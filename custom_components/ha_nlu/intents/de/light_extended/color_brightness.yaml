language: "de"
intents:
  # Optional {percent} slot: absent -> LightExtendedParser defaults to 10%
  # (user decision, v2 plan Phase 14). Routed here (not to PercentageParser)
  # via engine.py's _LIGHT_EXTENDED_RE, checked before _PERCENT_RE since
  # "mach das Licht 20 Prozent heller" contains both "Prozent" and "heller".
  # The percent-bearing sentences anchor {percent} with the literal "um"
  # (rather than the plan's unanchored "{name} {percent} Prozent heller"):
  # empirically verified against hassil==3.11.0 that an unanchored
  # WildcardSlotList immediately before a RangeSlotList silently yields
  # percent=0 instead of failing to match or capturing the real value - a
  # different (and worse) failure mode than the {name}/{color} TextSlotList
  # adjacency, which *does* work unanchored (see HassLightSetColor below).
  # "um X Prozent heller machen" is standard German idiom anyway.
  #
  # Listed *before* the plain (no-percent) sentence in each intent: since
  # {name} is an unanchored wildcard, the plain sentence would otherwise
  # also structurally match a percent-bearing input ({name} simply swallows
  # "... um 20 Prozent" too) - empirically verified that hassil's
  # recognize() picks the first structurally-matching sentence in list
  # order (same "recognize_all() file/sentence order" behaviour engine.py's
  # module docstring already documents for the quantifier/single-target
  # grammar split), so the more specific sentence must come first.
  HassLightBrighten:
    data:
      - sentences:
          - "[kannst du] mach [den|die|das] {name} um {percent} Prozent heller"
          - "[kannst du|bitte] [den|die|das] {name} um {percent} Prozent heller machen"
          - "[kannst du] mach [den|die|das] {name} heller"
          - "[kannst du|bitte] [den|die|das] {name} heller machen"
  HassLightDim:
    data:
      - sentences:
          - "[kannst du] mach [den|die|das] {name} um {percent} Prozent dunkler"
          - "[kannst du|bitte] [den|die|das] {name} um {percent} Prozent dunkler machen"
          - "[kannst du] mach [den|die|das] {name} dunkler"
          - "[kannst du|bitte] [den|die|das] {name} dunkler machen"
  # {name} directly adjacent to {color}/{color_temp}, no anchor word between
  # them - verified empirically against hassil==3.11.0 not to collide with
  # the {name}-wildcard turn-on/off sentences (light_switch.yaml).
  HassLightSetColor:
    data:
      - sentences:
          - "mach [den|die|das] {name} {color}"
          - "stelle [den|die|das] {name} auf {color}"
          - "[kannst du|bitte] [den|die|das] {name} {color} machen"
  HassLightSetColorTemp:
    data:
      - sentences:
          - "mach [den|die|das] {name} {color_temp}"
          - "stelle [den|die|das] {name} auf {color_temp}"
          - "[kannst du|bitte] [den|die|das] {name} {color_temp} machen"
