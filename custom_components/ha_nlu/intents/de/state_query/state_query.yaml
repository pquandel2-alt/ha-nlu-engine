language: "de"
intents:
  # HomeIntent V4.2, "Semantic Query & State Resolution" - the 13th
  # separately-compiled hassil grammar (see parsers.py's StateQueryParser
  # docstring). Three intents, not one merged intent: cardinality/response
  # shape differs fundamentally between them (plural list/count vs. singular
  # boolean vs. existence), same "one intent per distinct response shape"
  # precedent HassGetState/HassQueryComparison already set.
  #
  # {state}/{state_adj} are two separate slots (not one) because German
  # inflects the same semantic word differently in predicate vs. attributive
  # position: "die Fenster sind offen" (predicate, {state}) vs. "gibt es
  # offene Fenster" (attributive, {state_adj}) - both resolve to the same
  # SemanticState member name via parsers.py's StateQueryParser, just via two
  # different TextSlotLists.
  # "[noch]" (still/yet) is an optional filler word - "Welche Fenster sind
  # noch geöffnet?" is idiomatic German and was one of the two originally-
  # reported failing live sentences (see spec). It carries no semantic
  # weight of its own (SemanticState doesn't change), so it's just an
  # optional literal, same pattern as the existing "[bitte]"/"[kannst du]"
  # fillers elsewhere in this project's grammars. "[denn]" (a German
  # rhetorical-question filler, "Sind denn Fenster offen?") is the same kind
  # of semantically-inert optional literal, added everywhere "[noch]" is for
  # the same reason (spec gap #2).
  #
  # The bare "sind {device_class} [noch] {state}" sentence (no "welche"/"wie
  # viele" prefix - spec gap #3) is a third, equally natural German phrasing
  # ("Sind Fenster noch offen?"). Routing-wise this already reaches
  # StateQueryParser today since "sind" is already one of _STATE_QUERY_RE's
  # trigger words in engine.py - only the grammar template itself was
  # missing.
  HassStateQuery:
    data:
      - sentences:
          - "welche {device_class} sind [denn] [noch] {state}"
          - "welche {device_class} sind [in der|in dem|im|am|beim] {area} [denn] [noch] {state}"
          - "wie viele {device_class} sind [denn] [noch] {state}"
          - "wie viele {device_class} sind [in der|in dem|im|am|beim] {area} [denn] [noch] {state}"
          - "sind [denn] {device_class} [noch] {state}"
          - "sind [in der|in dem|im|am|beim] {area} [denn] {device_class} [noch] {state}"
          # WorldModelQuery wave: stateless listing ("Welche Lampen sind im
          # Wohnzimmer?") - no {state} slot at all, area-scoped only. Reuses
          # the exact same {device_class}/{area} slots as the sentences
          # above - no new vocabulary. Requires {area} (unlike the {state}
          # variants) since a bare "welche Lampen sind" has no verb
          # complement to anchor on - "niemals raten" a scope that wasn't
          # spoken.
          - "welche {device_class} sind [in der|in dem|im|am|beim] {area}"
  # HassExistsQuery MUST be listed before HassCheckState: "ist ein {device_class}
  # ... {state}" (the new word-order variant below, spec gap #4 - "Ist im
  # Wohnzimmer ein Fenster offen?") structurally also matches HassCheckState's
  # "ist [die|der|das] {name} ... {state}" template, since {name} is an
  # open-ended WildcardSlotList that happily captures "ein Fenster" too (no
  # entity is actually named that, so it would silently fail entity
  # resolution instead of ever reaching HassExistsQuery). Empirically
  # verified (this session, hassil==3.11.0): when two intents in the same
  # Intents object both structurally match one input text, hassil returns
  # the intent that appears *first* in the source dict, regardless of
  # literal-vs-wildcard specificity - so intent declaration order here is
  # load-bearing, not cosmetic. "ist das Fenster offen" (with a real
  # die/der/das article) still resolves to HassCheckState correctly despite
  # this reordering, since HassExistsQuery's variant requires the literal
  # word "ein", not "das".
  HassExistsQuery:
    data:
      - sentences:
          - "gibt es [denn] [noch] {state_adj} {device_class}"
          - "gibt es [denn] [noch] [in der|in dem|im|am|beim] {area} {state_adj} {device_class}"
          - "gibt es [denn] [noch] {state_adj} {device_class} [in der|in dem|im|am|beim] {area}"
          - "gibt es [denn] [noch] {device_class}"
          - "gibt es [denn] [noch] [in der|in dem|im|am|beim] {area} {device_class}"
          - "gibt es [denn] [noch] {device_class} [in der|in dem|im|am|beim] {area}"
          # "ist [im {area}] ein {device_class} [noch] {state}" (spec gap
          # #4): existence phrased with "ist"/indefinite article instead of
          # "gibt es" - still EXISTS semantics (no specific named entity),
          # not HassCheckState (which needs a {name}).
          - "ist [in der|in dem|im|am|beim] {area} [denn] ein {device_class} [noch] {state}"
          - "ist [denn] ein {device_class} [in der|in dem|im|am|beim] {area} [noch] {state}"
          - "ist [denn] ein {device_class} [noch] {state}"
  # The area-scoped sentence MUST be listed before the bare one: {name} is
  # an open-ended WildcardSlotList (unlike {device_class} above, which is a
  # closed vocabulary), so when both templates are candidates hassil prefers
  # whichever one it tries first - listed second, the area-scoped template
  # would never be reached, since the bare template's unconstrained {name}
  # always succeeds first by swallowing "{name} im {area}" whole (confirmed
  # live: silently resolved to the wrong entity - Regel 4 violation - see
  # git history for the live incident this ordering fixes).
  HassCheckState:
    data:
      - sentences:
          - "ist [die|der|das] {name} [in der|in dem|im|am|beim] {area} [denn] [noch] {state}"
          - "ist [die|der|das] {name} [denn] [noch] {state}"
  # WorldModelQuery wave: device-level query ("Welche Geräte sind im Büro?")
  # - no {device_class}/{state} slot, devices are cross-domain and answered
  # from the WorldModel's device list, not an entity/state filter (see
  # StateQueryParser._parse_device_query).
  HassDeviceQuery:
    data:
      - sentences:
          - "welche geräte sind [in der|in dem|im|am|beim] {area}"
          - "welche geräte befinden sich [in der|in dem|im|am|beim] {area}"
          - "was für geräte sind [in der|in dem|im|am|beim] {area}"
