language: "de"
intents:
  # HomeIntent plan V4.9, "Cross-Sentence References" - follow-up half. The
  # 12th separately-compiled hassil grammar (see parsers.py's
  # QueryFollowupParser docstring): "Und in der Küche?"/"Und oben?" after a
  # previous state query - domain/device_class are carried over from the
  # previous turn's ConversationContext, never re-spoken here, so this
  # grammar only needs to capture the *new* room or floor.
  #
  # The locative preposition before {area} is a *mandatory* alternation
  # "(...)" here, not the optional "[...]" every other {area} grammar in
  # this project uses - empirically verified against hassil==3.11.0 before
  # writing this file: with an optional/omittable preposition, "und oben"
  # structurally matches *this* sentence too (the {area} wildcard just
  # swallows "oben" with zero preceding words), silently shadowing the
  # dedicated "und {level}" sentence below since hassil tries sentences in
  # declaration order. Every other {area} grammar in this project is safe
  # with an optional preposition only because {area} there always sits
  # between two fixed words (a verb/domain before, "an"/"aus"/"hoch"/...
  # after) that a bare "oben"/"unten" could never also satisfy - here "und"
  # is the *only* fixed word either sentence has, so the two shapes would
  # otherwise be indistinguishable without a required preposition.
  HassGetState:
    data:
      - sentences:
          - "und (in der|in dem|im|am|beim) {area}"
          - "und {level}"
          # Delta follow-ups (live-bug fix, 2026-08-18): a state-query
          # follow-up doesn't have to repeat the room - it can instead
          # change *what*/*which state* is asked about ("Und welche Türen
          # sind offen?", "Und welche sind geschlossen?"), or combine a
          # target/state change with a fresh room in one sentence. These
          # four sentences are the generic delta grammar QueryFollowupParser
          # merges against the previous turn's QueryCommand (see its
          # docstring) - whichever of {device_class}/{state}/{area} is
          # *absent* here is carried over from the previous turn, never
          # re-derived by a per-sentence special case.
          - "und welche {device_class} sind {state}"
          - "und welche sind {state}"
          - "und welche {device_class} sind {state} (in der|in dem|im|am|beim) {area}"
