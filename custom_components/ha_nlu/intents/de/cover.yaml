language: "de"
intents:
  # "ganz auf"/"ganz zu" (v2 plan Phase 15) reuse the existing open_cover/
  # close_cover service calls - "ganz" ("fully") is just emphasis on the
  # same fully-open/fully-closed meaning "öffnen"/"schließen" already have,
  # not a distinct target position. Listed *before* the plain "auf"/"zu"
  # sentences: empirically verified against hassil==3.11.0 (same Bug 2
  # class documented in Phase 14/color_brightness.yaml) that otherwise the
  # plain sentence's unanchored {name} swallows "ganz" too (e.g. "mach das
  # Rollladen ganz auf" -> name="Rollladen ganz" instead of "Rollladen"),
  # since both sentences structurally match and hassil picks the first in
  # list order.
  HassOpenCover:
    data:
      - sentences:
          - "[kannst du] mach [den|die|das] {name} ganz auf"
          - "[kannst du] öffne [den|die|das] {name}"
          - "[kannst du] fahre [den|die|das] {name} hoch"
          - "[kannst du|bitte] [den|die|das] {name} hochfahren"
          - "[kannst du|bitte] [den|die|das] {name} öffnen"
          - "[kannst du] mach [den|die|das] {name} auf"
          - "[bitte] [den|die|das] {name} hoch"
  HassCloseCover:
    data:
      - sentences:
          - "[kannst du] mach [den|die|das] {name} ganz zu"
          - "[kannst du] schließe [den|die|das] {name}"
          - "[kannst du] fahre [den|die|das] {name} runter"
          - "[kannst du|bitte] [den|die|das] {name} runterfahren"
          - "[kannst du|bitte] [den|die|das] {name} schließen"
          - "[kannst du] mach [den|die|das] {name} zu"
          - "[bitte] [den|die|das] {name} runter"
