language: "de"
intents:
  # Live conversation-context follow-up fix (2026-08-18): a command
  # follow-up that omits its own target entirely ("Und jetzt wieder aus."
  # right after "Schalte das Studio ein.") - mirrors context_followup/'s
  # "heller"/"dunkler"/"wärmer"/"kälter" shape (no {name} at all, resolved
  # by the caller against ``ConversationContext.last_command``), not a
  # per-sentence special case.
  #
  # "wieder" is the operative discourse marker ("again, but the other way")
  # - ``parsers.CommandFollowupParser`` computes the actual target intent
  # via ``service_call.ACTION_OPPOSITES``, never by decoding the trailing
  # direction word itself (that word only has to be *present*, matching
  # natural spoken phrasing, so the grammar accepts on/off/open/close
  # wording without a second word->intent mapping that could drift out of
  # sync with ``ACTION_OPPOSITES`` - Regel 6, one source of truth).
  # "[jetzt]" is a semantically inert optional filler, same "[noch]"/
  # "[denn]" precedent state_query.yaml already established.
  HassCommandFollowupInvert:
    data:
      - sentences:
          - "und [jetzt] wieder an"
          - "und [jetzt] wieder aus"
          - "und [jetzt] wieder ein"
          - "und [jetzt] wieder zu"
          - "und [jetzt] wieder auf"
          - "mach es [jetzt] wieder an"
          - "mach es [jetzt] wieder aus"
          - "mach es [jetzt] wieder zu"
          - "mach es [jetzt] wieder auf"
          - "schalte es [jetzt] wieder an"
          - "schalte es [jetzt] wieder aus"
          - "schalte es [jetzt] wieder ein"

  # "Und im Schlafzimmer auch." after "Mach das Licht im Wohnzimmer an." -
  # the *same* action as the previous command, applied to a fresh area
  # instead of the remembered one ("auch" signals continuation, not
  # inversion - must not be confused with the "wieder" sentences above).
  # Mandatory locative preposition before {area} (not "[...]"), same
  # reasoning query_followup.yaml's own {area} sentence documents: an
  # optional preposition here would let a bare "und {area}"-shaped
  # sentence collide with this grammar's own future extension, so the
  # preposition stays required from the start.
  HassCommandFollowupSameActionNewArea:
    data:
      - sentences:
          - "und (in der|in dem|im|am|beim) {area} auch"
