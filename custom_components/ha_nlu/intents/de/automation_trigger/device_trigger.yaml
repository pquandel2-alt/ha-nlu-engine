language: "de"
intents:
  # V5 Wave 1 (V5.3) - the Device Trigger, Home Assistant's own `device`
  # trigger platform (device_id + type, fires on a device-level event like a
  # button press - distinct from `state`'s entity_id + to). {name} resolves
  # to an *entity* via the existing resolver (devices.py deliberately has no
  # spoken-device-name resolver, see its own docstring) -
  # automation_trigger_parser.py then looks up that entity's owning device
  # via WorldModel.device_for_entity(), never a name-based device lookup.
  HassDeviceTrigger:
    data:
      - sentences:
          - "[wenn|sobald|falls] [der|die|das] {name} {device_press_type}"
