language: "de"
intents:
  HassTurnOn:
    data:
      - sentences:
          - "mach [die] {quantifier} [die] {domain} an"
          - "schalte [die] {quantifier} [die] {domain} ein"
          - "kannst du [die] {quantifier} [die] {domain} anmachen"
          - "bitte [die] {quantifier} [die] {domain} an"
          - "mach [die] {quantifier} [die] {domain} {level} an"
          - "schalte [die] {quantifier} [die] {domain} {level} ein"
          - "kannst du [die] {quantifier} [die] {domain} {level} anmachen"
          - "mach [die] {quantifier} [die] {domain} [in der|in dem|im|am|beim] {area} an"
          - "schalte [die] {quantifier} [die] {domain} [in der|in dem|im|am|beim] {area} ein"
          - "kannst du [die] {quantifier} [die] {domain} [in der|in dem|im|am|beim] {area} anmachen"
          - "mach die {count} {domain} an"
          - "schalte die {count} {domain} ein"
          - "kannst du die {count} {domain} anmachen"
          - "mach die {count} {domain} [in der|in dem|im|am|beim] {area} an"
          - "schalte die {count} {domain} [in der|in dem|im|am|beim] {area} ein"
          - "mach alle {domain} an außer [dem|der|den] {name}"
          - "schalte alle {domain} ein außer [dem|der|den] {name}"
          # "dreh"/"lass" (V4.1): only the base quantifier form, not every
          # {level}/{area}/{count} combination - same "no YAML combinatorics"
          # restraint the plan itself asks for.
          - "dreh [die] {quantifier} [die] {domain} an"
          - "lass [die] {quantifier} [die] {domain} an"
          # {level} without a {quantifier} word (HomeIntent plan V4.3,
          # "Implicit Targets" - "Mach oben die Lichter aus." has no
          # alle/beide/nur, and "oben" sits *before* the domain, unlike the
          # {quantifier} sentences' trailing {level} above). QuantifierParser
          # .parse() already defaults to quantifier="all" whenever neither
          # {quantifier} nor {count} is present (see its docstring, case 3) -
          # same fallback the {domain}-außer-{name} exclusion sentences
          # already rely on - so this needs no new resolution code, only the
          # sentence itself.
          - "mach {level} [die] {domain} an"
          - "schalte {level} [die] {domain} ein"
          - "kannst du {level} [die] {domain} anmachen"
  HassTurnOff:
    data:
      - sentences:
          - "mach [die] {quantifier} [die] {domain} aus"
          - "schalte [die] {quantifier} [die] {domain} aus"
          - "kannst du [die] {quantifier} [die] {domain} ausmachen"
          - "bitte [die] {quantifier} [die] {domain} aus"
          - "mach [die] {quantifier} [die] {domain} {level} aus"
          - "schalte [die] {quantifier} [die] {domain} {level} aus"
          - "kannst du [die] {quantifier} [die] {domain} {level} ausmachen"
          - "mach [die] {quantifier} [die] {domain} [in der|in dem|im|am|beim] {area} aus"
          - "schalte [die] {quantifier} [die] {domain} [in der|in dem|im|am|beim] {area} aus"
          - "kannst du [die] {quantifier} [die] {domain} [in der|in dem|im|am|beim] {area} ausmachen"
          - "mach die {count} {domain} aus"
          - "schalte die {count} {domain} aus"
          - "kannst du die {count} {domain} ausmachen"
          - "mach die {count} {domain} [in der|in dem|im|am|beim] {area} aus"
          - "schalte die {count} {domain} [in der|in dem|im|am|beim] {area} aus"
          - "mach alle {domain} aus außer [dem|der|den] {name}"
          - "schalte alle {domain} aus außer [dem|der|den] {name}"
          - "dreh [die] {quantifier} [die] {domain} aus"
          - "lass [die] {quantifier} [die] {domain} aus"
          - "mach {level} [die] {domain} aus"
          - "schalte {level} [die] {domain} aus"
          - "kannst du {level} [die] {domain} ausmachen"
  HassToggle:
    data:
      - sentences:
          - "schalte [die] {quantifier} [die] {domain} um"
          - "toggle [die] {quantifier} [die] {domain}"
          - "schalte [die] {quantifier} [die] {domain} {level} um"
          - "schalte [die] {quantifier} [die] {domain} [in der|in dem|im|am|beim] {area} um"
