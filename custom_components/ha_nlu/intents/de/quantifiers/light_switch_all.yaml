language: "de"
intents:
  HassTurnOn:
    data:
      - sentences:
          - "mach {quantifier} {domain} an"
          - "schalte {quantifier} {domain} ein"
          - "kannst du {quantifier} {domain} anmachen"
          - "bitte {quantifier} {domain} an"
          - "mach {quantifier} {domain} {level} an"
          - "schalte {quantifier} {domain} {level} ein"
          - "kannst du {quantifier} {domain} {level} anmachen"
          - "mach {quantifier} {domain} [in der|in dem|im|am|beim] {area} an"
          - "schalte {quantifier} {domain} [in der|in dem|im|am|beim] {area} ein"
          - "kannst du {quantifier} {domain} [in der|in dem|im|am|beim] {area} anmachen"
  HassTurnOff:
    data:
      - sentences:
          - "mach {quantifier} {domain} aus"
          - "schalte {quantifier} {domain} aus"
          - "kannst du {quantifier} {domain} ausmachen"
          - "bitte {quantifier} {domain} aus"
          - "mach {quantifier} {domain} {level} aus"
          - "schalte {quantifier} {domain} {level} aus"
          - "kannst du {quantifier} {domain} {level} ausmachen"
          - "mach {quantifier} {domain} [in der|in dem|im|am|beim] {area} aus"
          - "schalte {quantifier} {domain} [in der|in dem|im|am|beim] {area} aus"
          - "kannst du {quantifier} {domain} [in der|in dem|im|am|beim] {area} ausmachen"
  HassToggle:
    data:
      - sentences:
          - "schalte {quantifier} {domain} um"
          - "toggle {quantifier} {domain}"
          - "schalte {quantifier} {domain} {level} um"
          - "schalte {quantifier} {domain} [in der|in dem|im|am|beim] {area} um"
